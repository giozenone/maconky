name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: make app
      - name: Confirm architectures
        run: lipo -archs Maconky.app/Contents/MacOS/Maconky
      - name: Zip app
        run: ditto -c -k --keepParent Maconky.app Maconky-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Maconky-universal
          path: Maconky-universal.zip
